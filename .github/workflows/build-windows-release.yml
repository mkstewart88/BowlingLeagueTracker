name: Build Windows Installer & Release Assets

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 & NSIS cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single-file bundle & compile root installer.exe
        run: |
          npm ci
          npm run build
          node desktop/scripts/build-installer.mjs
          mkdir -p dist-win/BowlingLeagueHelper-Package
          cp installer.exe dist-win/BowlingLeagueHelper-Package/installer.exe
          cp desktop/README-Windows.txt dist-win/BowlingLeagueHelper-Package/README.txt
          (cd dist-win/BowlingLeagueHelper-Package && zip -r ../../BowlingLeagueHelper-Windows.zip .)

      - name: Read app version from version.json
        id: ver
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('version.json','utf8')).latestVersion)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BowlingLeagueHelper-Windows-v${{ steps.ver.outputs.version }}
          path: |
            installer.exe
            BowlingLeagueHelper-Windows.zip

      - name: Publish Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Bowling League Helper v${{ steps.ver.outputs.version }}
          body: |
            Download the repository ZIP (or `installer.exe` directly), run **`installer.exe`** to install into `C:\BowlingLeagueHelper\` with the Desktop icon shortcut, and delete the ZIP afterward.
          files: |
            installer.exe
            BowlingLeagueHelper-Windows.zip
            BowlingLeagueHelper.html
            version.json
