name: CI — Build, Test & Verify Windows 11 / Linux Assets

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 & NSIS cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies, lint, unit test & build single-file bundle
        run: |
          npm ci
          npm run lint
          npx tsx --test src/utils/bowlingLogic.test.ts
          npm run build

      - name: Compile Windows 11 host & root installer.exe
        run: |
          node desktop/scripts/build-installer.mjs
          chmod +x install-linux.sh
          test -f installer.exe
          test -f BowlingLeagueHelper.html

      - name: Upload Build Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BowlingLeagueHelper-Build-Artifacts
          path: |
            installer.exe
            install-linux.sh
            BowlingLeagueHelper.html
            version.json
